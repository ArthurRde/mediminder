spring:
  application:
    name: mediminder
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:mediminder}
    username: ${POSTGRES_USER:mediminder}
    password: ${POSTGRES_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

mediminder:
  jwt:
    secret: ${MEDIMINDER_JWT_SECRET}
    expiration-ms: 86400000
