spring:
  application:
    name: mediminder
  config:
    import: optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:mediminder}
    username: ${POSTGRES_USER:mediminder}
    password: ${POSTGRES_PASSWORD:mediminder}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: 8080

mediminder:
  jwt:
    # Dev-Default, für Produktion per Umgebungsvariable überschreiben
    secret: ${MEDIMINDER_JWT_SECRET:i/CzAqa85UZ1XGBj064DCjHPzNi10pgycTdzbJW0qfBMXHKSxNd6X9BzsWGpvG+M}
    expiration-ms: 86400000
